[package]
name = "wisp-photo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rawloader = "0.37"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
