# /etc/nginx/sites-available/wisp.boety.fun
#
# Client ──TLS──▶ Cloudflare edge ──TLS (Full strict)──▶ this Nginx ──▶ Node :8080
#
# Nginx serves the static web root (UI + runtime bundles) itself and proxies
# only the Wisp WebSocket and the status API to Node. Real client IPs come
# from CF-Connecting-IP via /etc/nginx/conf.d/cloudflare-realip.conf, which
# scripts/cloudflare-sync.sh generates.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wisp_node {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name wisp.boety.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wisp.boety.fun;

    # Cloudflare Origin CA certificate (SSL/TLS → Origin Server → Create).
    ssl_certificate     /etc/ssl/cloudflare/wisp.boety.fun.pem;
    ssl_certificate_key /etc/ssl/cloudflare/wisp.boety.fun.key;

    # Optional: Authenticated Origin Pulls — only Cloudflare can complete the
    # TLS handshake. Enable in SSL/TLS → Origin Server, then uncomment.
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;

    root /opt/wisp.boety.fun/public;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Binary WebSocket relay (Wisp multiplexer). wisp-js pings every 30s,
    # which keeps the socket under Cloudflare's 100s idle cutoff.
    location /wisp/ {
        proxy_pass http://wisp_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Chat room WebSocket (messages, presence, video call signalling).
    location /chat/ {
        proxy_pass http://wisp_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Chat photo uploads (the app limits each photo to 10 MB).
    location = /api/chat/photo {
        client_max_body_size 12m;
        proxy_pass http://wisp_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://wisp_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The service worker must always revalidate so updates roll out.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Runtime bundles (copied in by `npm install`).
    location ~ ^/(scram|baremux|epoxy|mediabunny)/ {
        types {
            application/javascript js mjs;
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Public static files are served directly; everything else (the app
    # shell, /login, deep links) goes to Node, which checks the session.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://wisp_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
